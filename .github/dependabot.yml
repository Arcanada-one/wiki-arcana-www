version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
      semver-major-days: 30
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    # Transitive security fixes need the lockfile refreshed, not package.json
    # edited, so indirect updates must be allowed or scheduled runs simply fail.
    allow:
      - dependency-type: "all"
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
