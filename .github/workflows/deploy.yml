name: deploy

on:
  push:
    branches: [main]

jobs:
  call:
    uses: Arcanada-one/shared-workflows/.github/workflows/deploy-static-site.yml@193f11de478b342572c7828ad294433a07743fc5 # v1
    with:
      domain: arcanada.wiki
      webroot: arcanada.wiki
    secrets:
      OPSBOT_URL: ${{ secrets.OPSBOT_URL }}
      OPSBOT_KEY: ${{ secrets.OPSBOT_KEY }}
