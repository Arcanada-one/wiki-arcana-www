name: deploy

on:
  push:
    branches: [main]

jobs:
  call:
    uses: Arcanada-one/shared-workflows/.github/workflows/deploy-static-site.yml@61088e2e2a101deba6edbe674d010a42f9b4c234 # v1
    with:
      domain: arcanada.wiki
      webroot: arcanada.wiki
    secrets:
      OPSBOT_URL: ${{ secrets.OPSBOT_URL }}
      OPSBOT_KEY: ${{ secrets.OPSBOT_KEY }}
